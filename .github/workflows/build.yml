name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      # No secrets on pull requests from forks, so fall back to an unsigned
      # compile check rather than failing the job.
      - name: Decide signing mode
        id: mode
        env:
          CERT: ${{ secrets.CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import Developer ID certificate
        if: steps.mode.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build and sign
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then
            make app SIGN_ID="${{ secrets.SIGN_IDENTITY }}"
          else
            echo "no certificate available — unsigned compile check only"
            make app SIGN_ID="-"
          fi

      - name: Verify signature
        if: steps.mode.outputs.signed == 'true'
        run: |
          codesign --verify --strict --verbose=2 build/PrivilegesRearm.app
          codesign -dvvv build/PrivilegesRearm.app 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"

      # Only needed because a downloaded artifact is quarantined; Gatekeeper
      # will refuse to launch it otherwise.
      - name: Notarize and staple
        if: steps.mode.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/ac_api_key.p8"
          printf '%s' "$AC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          ditto -c -k --keepParent build/PrivilegesRearm.app "$RUNNER_TEMP/PrivilegesRearm.zip"
          xcrun notarytool submit "$RUNNER_TEMP/PrivilegesRearm.zip" \
            --key "$KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --wait

          rm -f "$KEY_PATH"
          xcrun stapler staple build/PrivilegesRearm.app
          xcrun stapler validate build/PrivilegesRearm.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/PrivilegesRearm.app build/PrivilegesRearm.zip
          shasum -a 256 build/PrivilegesRearm.zip

      - uses: actions/upload-artifact@v5
        with:
          name: PrivilegesRearm
          path: build/PrivilegesRearm.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/PrivilegesRearm.zip
